plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

bootJar.enabled = false
jar.enabled = false

allprojects {
    group = 'com.eda'
    version = '0.0.1-SNAPSHOT'
    sourceCompatibility = '17'

    repositories {
        maven {
            url 'https://eda-repository-023013950167.d.codeartifact.ap-northeast-1.amazonaws.com/maven/eda_repository/'
            credentials {
                username "aws"
                password getAwsCodeArtifactToken()
            }
            content {
                includeGroup "com.eda"  // ✅ 특정 groupId만 CodeArtifact에서 찾도록 설정
            }
        }
        mavenCentral()
    }
}

subprojects { // 모든 하위 모듈들에 이 설정을 적용합니다.

    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    dependencies {
        implementation "me.paulschwarz:spring-dotenv:3.0.0"

//        implementation 'org.springframework.boot:spring-boot-starter'
//        implementation 'org.springframework.boot:spring-boot-starter-actuator'
//        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        // lombok
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}

def getAwsCodeArtifactToken() {
    def stdout = new ByteArrayOutputStream()
    exec {
        commandLine 'aws', 'codeartifact', 'get-authorization-token',
                '--domain', 'eda-repository',
                '--domain-owner', '023013950167',
                '--region', 'ap-northeast-1',
                '--query', 'authorizationToken',
                '--output', 'text'
        standardOutput = stdout
    }
    return stdout.toString().trim()
}