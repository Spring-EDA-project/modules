plugins {
    id 'java'
}

group = 'org.external'
version = 'unspecified'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':module-common')
    implementation project(':module-core:member-rdbms-core')
    implementation project(':module-core:member-domain-core')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}